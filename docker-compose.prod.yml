version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: imglio_backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - backend_data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_data: