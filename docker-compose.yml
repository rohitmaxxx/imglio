services:
  backend:
    build:
      context: ./backend
    container_name: imglio_backend
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost,http://localhost:3000}
      ANALYTICS_DB: ${ANALYTICS_DB:-data/analytics.db}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persists the SQLite analytics DB (backend/data/analytics.db) across restarts.
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - imglio_network

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time — must be reachable from
        # wherever the user's browser runs, not just inside the Docker network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: imglio_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Runtime-only (never inlined into the client bundle) — lets the Next.js
      # server itself reach FastAPI over the compose network.
      API_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - imglio_network

  nginx:
    image: nginx:1.27-alpine
    container_name: imglio_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - imglio_network

volumes:
  backend_data:

networks:
  imglio_network:
    driver: bridge
